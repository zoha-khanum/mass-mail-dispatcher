<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mass-Mail Dispatcher</title>

    <!-- Removes favicon 404 -->
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #24364b;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 55px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 12px;
            color: #24364b;
        }

        .header p {
            font-size: 18px;
            color: #666;
        }

        /* UPLOAD */

        .upload-box {
            background: white;
            padding: 32px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        #csvFile {
            width: 350px;
            padding: 13px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        button {
            border: none;
            background: #3498db;
            color: white;
            padding: 14px 28px;
            font-size: 17px;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #287eb8;
        }

        /* VALID / INVALID */

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 35px;
        }

        .result-box {
            background: white;
            min-height: 220px;
            padding: 30px;
            border-radius: 15px;
        }

        .result-box h2 {
            text-align: center;
            margin-bottom: 22px;
            color: #24364b;
            font-size: 26px;
        }

        .result-box ul {
            padding-left: 25px;
            line-height: 1.8;
            color: #333;
            word-break: break-word;
        }

        /* COMPOSE MAIL */

        .mail-box {
            background: white;
            border-radius: 15px;
            padding: 35px;
            text-align: center;
        }

        .mail-box h2 {
            margin-bottom: 25px;
            font-size: 28px;
            color: #24364b;
        }

        #subject,
        #message {
            display: block;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            margin-bottom: 18px;
            font-family: Arial, sans-serif;
        }

        #subject {
            height: 55px;
        }

        #message {
            min-height: 160px;
            resize: vertical;
        }

        #sendBtn {
            margin-top: 5px;
            padding: 15px 32px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header h1 {
                font-size: 32px;
            }

            .upload-box {
                flex-direction: column;
            }

            #csvFile {
                width: 100%;
            }

            .results {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Mass-Mail Dispatcher</h1>

            <p>
                Upload a CSV file containing email addresses
            </p>
        </div>


        <div class="upload-box">

            <input
                type="file"
                id="csvFile"
                accept=".csv"
            >

            <button id="uploadBtn">
                Upload CSV
            </button>

        </div>


        <div class="results">

            <div class="result-box">

                <h2>Valid Emails</h2>

                <ul id="validEmails"></ul>

            </div>


            <div class="result-box">

                <h2>Invalid Emails</h2>

                <ul id="invalidEmails"></ul>

            </div>

        </div>


        <div class="mail-box">

            <h2>Compose Mail</h2>

            <input
                type="text"
                id="subject"
                placeholder="Enter Subject"
            >

            <textarea
                id="message"
                placeholder="Enter your message"
            ></textarea>

            <button id="sendBtn">
                Send Mail
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

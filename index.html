<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mass-Mail Dispatcher</title>

    <!-- Prevent favicon 404 error -->
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ============================= -->
        <!-- HEADER -->
        <!-- ============================= -->

        <h1>Mass-Mail Dispatcher</h1>

        <p class="subtitle">
            Upload a CSV file containing email addresses
        </p>


        <!-- ============================= -->
        <!-- CSV UPLOAD -->
        <!-- ============================= -->

        <div class="upload-box">

            <input
                type="file"
                id="csvFile"
                accept=".csv"
            >

            <button id="uploadBtn">
                Upload CSV
            </button>

        </div>


        <!-- ============================= -->
        <!-- EMAIL RESULTS -->
        <!-- ============================= -->

        <div class="results">

            <div class="result-box">

                <h2>
                    Valid Emails
                </h2>

                <ul id="validEmails"></ul>

            </div>


            <div class="result-box">

                <h2>
                    Invalid Emails
                </h2>

                <ul id="invalidEmails"></ul>

            </div>

        </div>


        <!-- ============================= -->
        <!-- COMPOSE MAIL -->
        <!-- ============================= -->

        <div class="mail-box">

            <h2>
                Compose Mail
            </h2>

            <input
                type="text"
                id="subject"
                placeholder="Enter Subject"
                autocomplete="off"
            >


            <textarea
                id="message"
                placeholder="Enter your message"
                rows="7"
            ></textarea>


            <button id="sendBtn">
                Send Mail
            </button>

        </div>

    </div>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="script.js"></script>

</body>

</html>
